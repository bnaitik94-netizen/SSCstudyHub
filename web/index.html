  <!-- YOUTUBE IFRAME API SCRIPT FOR ACCELERATED WEB PLAYER INITIALIZATION -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- PDF.JS SCRIPTS REQUIRED FOR SYNCFUSION PDF VIEWER ON WEB -->
  <script src="//cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
  <script type="text/javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = "//cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js";
  </script>

  <!-- UNIVERSAL FULLSCREEN API ENGINE (PC & MOBILE CHROME / SAFARI) -->
  <script>
    window.isAppFullscreen = function() {
      return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
      );
    };

    window.requestAppFullscreen = function() {
      var elem = document.documentElement;
      if (elem.requestFullscreen) {
        return elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        return elem.webkitRequestFullscreen();
      } else if (elem.mozRequestFullScreen) {
        return elem.mozRequestFullScreen();
      } else if (elem.msRequestFullscreen) {
        return elem.msRequestFullscreen();
      }
      return Promise.resolve();
    };

    window.exitAppFullscreen = function() {
      if (document.exitFullscreen) {
        return document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        return document.webkitExitFullscreen();
      } else if (document.mozCancelFullScreen) {
        return document.mozCancelFullScreen();
      } else if (document.msExitFullscreen) {
        return document.msExitFullscreen();
      }
      return Promise.resolve();
    };

    // UNIVERSAL SCREEN WAKELOCK (PREVENTS SLEEP WHILE CLASS / APP IS RUNNING)
    var sscWakeLock = null;
    async function requestScreenWakeLock() {
      try {
        if ('wakeLock' in navigator && !sscWakeLock) {
          sscWakeLock = await navigator.wakeLock.request('screen');
          sscWakeLock.addEventListener('release', function() {
            sscWakeLock = null;
          });
        }
      } catch(err) {}
    }
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        requestScreenWakeLock();
      }
    });
    window.addEventListener('load', requestScreenWakeLock);
    window.addEventListener('click', requestScreenWakeLock, { once: true });

    window.sendYouTubePlayerCommand = function(command, args) {
      function findIframes(root) {
        var found = [];
        if (!root) return found;
        try {
          var list = root.querySelectorAll('iframe');
          for (var i = 0; i < list.length; i++) found.push(list[i]);
          var all = root.querySelectorAll('*');
          for (var j = 0; j < all.length; j++) {
            if (all[j].shadowRoot) {
              found = found.concat(findIframes(all[j].shadowRoot));
            }
          }
        } catch(e) {}
        return found;
      }
      var iframes = findIframes(document);
      for (var i = 0; i < iframes.length; i++) {
        try {
          iframes[i].contentWindow.postMessage(JSON.stringify({
            event: 'listening'
          }), '*');
          iframes[i].contentWindow.postMessage(JSON.stringify({
            event: 'command',
            func: command,
            args: args || []
          }), '*');
        } catch(e) {}
      }
    };
  </script>
