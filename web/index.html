<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B132B">
  <meta name="description" content="SSC Study Hub Pro: live classes, recorded lessons, schedules, and student support.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SSC Study Hub">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SSC Study Hub Pro</title>
  <link rel="manifest" href="manifest.json">

  <!-- YOUTUBE IFRAME API SCRIPT FOR ACCELERATED WEB PLAYER INITIALIZATION -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- PDF.JS SCRIPTS REQUIRED FOR SYNCFUSION PDF VIEWER ON WEB -->
  <script src="//cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
  <script type="text/javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = "//cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js";
  </script>

  <!-- UNIVERSAL FULLSCREEN API ENGINE (PC & MOBILE CHROME / SAFARI) -->
  <script>
    window.isAppFullscreen = function() {
      return !!(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
      );
    };

    window.requestAppFullscreen = function() {
      var elem = document.documentElement;
      var p = null;
      if (elem.requestFullscreen) {
        p = elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        p = elem.webkitRequestFullscreen();
      } else if (elem.mozRequestFullScreen) {
        p = elem.mozRequestFullScreen();
      } else if (elem.msRequestFullscreen) {
        p = elem.msRequestFullscreen();
      }

      // Automatically lock orientation to landscape ONLY on actual mobile phones/tablets
      try {
        var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isMobile && screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function(){});
        }
      } catch(e) {}

      return p || Promise.resolve();
    };

    window.exitAppFullscreen = function() {
      // Restore natural device orientation
      try {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      } catch(e) {}

      if (document.exitFullscreen) {
        return document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        return document.webkitExitFullscreen();
      } else if (document.mozCancelFullScreen) {
        return document.mozCancelFullScreen();
      } else if (document.msExitFullscreen) {
        return document.msExitFullscreen();
      }
      return Promise.resolve();
    };

    // UNIVERSAL SCREEN WAKELOCK (PREVENTS SLEEP WHILE CLASS / APP IS RUNNING)
    var sscWakeLock = null;
    async function requestScreenWakeLock() {
      try {
        if ('wakeLock' in navigator && !sscWakeLock) {
          sscWakeLock = await navigator.wakeLock.request('screen');
          sscWakeLock.addEventListener('release', function() {
            sscWakeLock = null;
          });
        }
      } catch(err) {}
    }
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'visible') {
        requestScreenWakeLock();
      }
    });
    window.addEventListener('load', requestScreenWakeLock);
    window.addEventListener('click', requestScreenWakeLock, { once: true });

    window.sendYouTubePlayerCommand = function(command, args) {
      function findIframes(root) {
        var found = [];
        if (!root) return found;
        try {
          var list = root.querySelectorAll('iframe');
          for (var i = 0; i < list.length; i++) found.push(list[i]);
          var all = root.querySelectorAll('*');
          for (var j = 0; j < all.length; j++) {
            if (all[j].shadowRoot) {
              found = found.concat(findIframes(all[j].shadowRoot));
            }
          }
        } catch(e) {}
        return found;
      }
      var iframes = findIframes(document);
      for (var i = 0; i < iframes.length; i++) {
        try {
          iframes[i].contentWindow.postMessage(JSON.stringify({
            event: 'listening'
          }), '*');
          iframes[i].contentWindow.postMessage(JSON.stringify({
            event: 'command',
            func: command,
            args: args || []
          }), '*');
        } catch(e) {}
      }
    };
  </script>
</head>
<body style="background-color: #0B132B; margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100vh; overscroll-behavior: none;">
  <!-- 🚀 ZERO-DELAY INSTANT SPLASH SCREEN (Shown in 0ms while Flutter Web compiles & loads) -->
  <div id="flutter-splash-screen" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #162544 0%, #0B132B 100%); z-index: 999999; transition: opacity 0.4s ease-out;">
    <div style="position: relative; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; margin-bottom: 22px;">
      <!-- Glowing ring -->
      <div style="position: absolute; inset: -4px; border-radius: 50%; background: linear-gradient(135deg, #38BDF8, #6366F1); opacity: 0.6; filter: blur(10px); animation: sscPulseGlow 2s infinite ease-in-out;"></div>
      <!-- Logo circle -->
      <div style="position: relative; width: 72px; height: 72px; border-radius: 50%; background: #0F172A; border: 1.5px solid rgba(56, 189, 248, 0.5); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </div>
    </div>
    <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 800; color: #FFFFFF; letter-spacing: 0.4px; margin-bottom: 8px;">
      SSC Study Hub Pro
    </div>
    <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; color: #94A3B8; margin-bottom: 24px;">
      Setting up your study space...
    </div>
    <!-- High-Performance Animated Progress Bar -->
    <div style="width: 190px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; position: relative;">
      <div style="position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 2px; background: linear-gradient(90deg, #38BDF8, #818CF8); animation: sscProgress 1.4s infinite ease-in-out;"></div>
    </div>
  </div>

  <style>
    @keyframes sscPulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.85; }
    }
    @keyframes sscProgress {
      0% { left: -40%; width: 35%; }
      50% { left: 30%; width: 55%; }
      100% { left: 100%; width: 35%; }
    }
  </style>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    function removeSscSplash() {
      var splash = document.getElementById('flutter-splash-screen');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(function() { if (splash) splash.remove(); }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', removeSscSplash);
    // Safety fallback: if first-frame event is missed or delayed, dismiss after 5s
    setTimeout(removeSscSplash, 5000);
  </script>
</body>
</html>
