name: ssc_study_hub
description: SSC Study Hub App with Live Classes, AI Doubts, and Zero-Lag Architecture.
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.2
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.2.10
  youtube_player_flutter: ^9.1.3
  shared_preferences: ^2.2.3
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  http: ^1.2.0
  googleapis_auth: ^1.4.1
  app_links: ^3.5.1
  url_launcher: ^6.3.0
  pointer_interceptor: ^0.10.1+3
  syncfusion_flutter_pdfviewer: ^35.1.37
  cached_network_image: ^3.3.1
  lottie: ^3.1.2
  wakelock_plus: ^1.7.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true